{% extends "base.html" %}
{% block title %}Sign in - PhytoBridge{% endblock %}
{% block content %}
<div class="authcard">
  <h1>Sign in</h1>
  <p class="muted">Sign in to save plants and keep your own notes alongside the evidence.</p>
  <form id="authform" autocomplete="on">
    <label>Email <input type="email" name="email" required maxlength="254"></label>
    <label>Password <input type="password" name="password" required minlength="8"></label>
    <button type="submit">Sign in</button>
    <p id="msg" class="formmsg" role="status"></p>
    <p class="muted">No account yet? <a href="/register">Create one</a>.</p>
  </form>
</div>
<script src="{{ url_for('static', filename='auth.js') }}"></script>
{% endblock %}
